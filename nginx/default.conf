# When a TLS terminator sits in front (Caddy, an org load balancer, Cloudflare)
# it forwards the original scheme in X-Forwarded-Proto; honour it so Django's
# SECURE_PROXY_SSL_HEADER sees "https" and doesn't loop on SECURE_SSL_REDIRECT.
# When nginx is itself the edge (no upstream header), fall back to its own scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    "~.+"   $http_x_forwarded_proto;
}

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

server {
    listen 80;

    # better-auth emits a few Set-Cookie headers at once — the session token, the
    # ~2.5KB JWE session_data cookie (Django access token), and the django_rt
    # refresh cookie — which can top nginx's 4k/8k defaults on the callback
    # response ("upstream sent too big header" -> 502) and on the request replay
    # ("Request Header Or Cookie Too Large" -> 400). A modest bump covers them.
    # (The pathological ~500KB case was the account_data cookie caching Azure AD
    # tokens; that's fixed at source via storeAccountCookie:false in auth.js, so
    # these no longer need to be oversized.)
    proxy_buffer_size 8k;
    proxy_buffers 8 8k;
    large_client_header_buffers 4 16k;

    # /api/auth/* belongs entirely to better-auth on the Next.js frontend
    # (sign-in, get-session, refresh-django-token, oauth2 callbacks, ...).
    # Django's own auth/token/api-key endpoints live under /api/account/ and
    # are served by the /api/ block below.
    location /api/auth/ {
        proxy_pass http://frontend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        proxy_pass http://backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}
