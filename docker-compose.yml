version: '3.9'
services:
  db:
    restart: always
    image: postgres:15
    container_name: tractor-postgres
    env_file:
      - '.env'
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data/

  ollama:
    # Pinned to the version Gemma's settings were tested with; upgrade on purpose.
    image: ollama/ollama:0.40.17
    container_name: tractor-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # For NVIDIA GPU passthrough, use the docker-compose.gpu.yml override.
    # On a Mac this container runs on CPU (Docker can't reach the GPU); for
    # Metal, install Ollama natively instead (see docs/dev/setup.md).

volumes:
  postgres_data:
  ollama_data: