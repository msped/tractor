services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    # More than one worker so a single slow or stuck request can't block the
    # whole API, and an explicit timeout rather than gunicorn's 30s default.
    # Document processing and exports run in the worker service, not here.
    command: >-
      gunicorn backend.wsgi:application --bind 0.0.0.0:8000
      --workers ${GUNICORN_WORKERS:-3} --timeout ${GUNICORN_TIMEOUT:-120}
    restart: unless-stopped
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
      - nlp_models_volume:/app/nlp_models
    expose:
      - 8000
    env_file: .env
    # Healthy once the entrypoint has migrated, collected static files and
    # fetched GLiNER. start_period covers the first-run model download.
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/setup-complete"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15m

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: python manage.py qcluster
    restart: unless-stopped
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
      - nlp_models_volume:/app/nlp_models
    env_file: .env
    # Setup (migrate, collectstatic, GLiNER download) is the backend's job;
    # running it here too races the backend's migrations on a fresh database.
    environment:
      - RUN_SETUP=false
    depends_on:
      backend:
        condition: service_healthy
    # Uncomment the section below to run GLiNER on an NVIDIA GPU during document
    # processing. SpanCat stays on CPU (spaCy's GPU support needs cupy, which the
    # image doesn't include). Requires NVIDIA drivers and nvidia-container-toolkit.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - 3000
    env_file: ./frontend/.env
    environment:
      - INTERNAL_API_HOST=http://backend:8000
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
    depends_on:
      - backend
      - frontend

  db:
    image: postgres:15
    restart: unless-stopped
    profiles:
      - db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: .env

  ollama:
    # Pinned to the version Gemma's settings were tested with; upgrade on purpose.
    image: ollama/ollama:0.40.17
    container_name: tractor-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    # Uncomment the section below to enable NVIDIA GPU passthrough.
    # Requires NVIDIA drivers and nvidia-container-toolkit on the host.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  postgres_data:
  static_volume:
  media_volume:
  nlp_models_volume:
  ollama_data:
